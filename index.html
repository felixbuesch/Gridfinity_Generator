<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gridfinity Planer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="intro" class="intro">
  <canvas id="introCanvas" aria-label="3D-Auswahl des Einsatzorts"></canvas>
  <div class="i-head">
    <div class="i-brand">Gridfinity <span>Planer</span></div>
    <h1 class="i-title">Wofür planst du?</h1>
    <p class="i-sub">Wähle den Einsatzort. Raster, Abstandshalter und Druckdateien rechnet der Planer.</p>
  </div>
  <div class="i-labels" id="iLabels"></div>
  <button type="button" class="i-back" id="iBack">← Andere Auswahl</button>
  <form class="i-panel" id="iForm" autocomplete="off">
    <aside id="iPanel" hidden>
      <div class="i-kicker" id="iKicker"></div>
      <h2 class="i-q" id="iQ"></h2>
      <div class="i-fields">
        <label class="i-f"><span>Breite</span><span class="i-in"><input id="iW" type="number" inputmode="decimal" min="42" step="0.5"><em>mm</em></span></label>
        <span class="i-x">×</span>
        <label class="i-f"><span>Tiefe</span><span class="i-in"><input id="iD" type="number" inputmode="decimal" min="42" step="0.5"><em>mm</em></span></label>
      </div>
      <div class="i-fits" title="Bei diesen Innenmaßen geht das Raster genau auf und es braucht keine Leisten. Klick übernimmt das Maß."><div id="iFitW"></div><div id="iFitD"></div></div>
      <p class="i-hint" id="iHint"></p>
      <div class="i-stats" id="iStats"></div>
      <button type="submit" class="i-go" id="iGo">Plan erstellen <span aria-hidden="true">→</span></button>
      <p class="i-drag">Ziehen dreht das Modell · Esc geht zurück</p>
    </aside>
  </form>
  <div class="i-fade"></div>
</div>

<div id="planer" hidden></div>

<div class="ftip" id="ftip" role="tooltip"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
